<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Student Result Management System</h1>

        <div class="form-section">
            <input type="text" id="name" placeholder="Student Name">
            <input type="number" id="maths" placeholder="Maths Marks">
            <input type="number" id="science" placeholder="Science Marks">
            <input type="number" id="english" placeholder="English Marks">

            <button onclick="addStudent()">Add Result</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Maths</th>
                    <th>Science</th>
                    <th>English</th>
                    <th>Total</th>
                    <th>Percentage</th>
                    <th>Grade</th>
                </tr>
            </thead>

            <tbody id="resultBody">

            </tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
